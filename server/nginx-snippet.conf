# Add these inside the server { } block of tr33s.co.ke and tr33s.tukosoko.com
# (in /etc/nginx/sites-enabled/tr33s.co.ke.conf and tr33s.tukosoko.com.conf), then:
#   nginx -t && systemctl reload nginx

# keep source files and git history private
location ^~ /server/ { return 404; }
location ~ /\.git   { return 404; }

# waitlist API, uploaded photos and the admin page
location ^~ /api/ {
    client_max_body_size 7m;
    proxy_pass http://127.0.0.1:3100;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location ^~ /uploads/ {
    proxy_pass http://127.0.0.1:3100;
    proxy_set_header Host $host;
}
location = /admin {
    proxy_pass http://127.0.0.1:3100;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
